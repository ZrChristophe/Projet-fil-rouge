<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription / Connexion</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>

<div class="container">
  <h2>Créer un compte</h2>
  <input type="text" id="nom" placeholder="Nom">
  <input type="text" id="prenom" placeholder="Prénom">
  <input type="email" id="email" placeholder="Email">
  <input type="tel" id="numero" placeholder="Numéro">
  <button onclick="inscrire()">S'inscrire</button>

  <h2>Connexion</h2>
  <input type="email" id="loginEmail" placeholder="Email">
  <button onclick="connecter()">Se connecter</button>

  <h2>Déconnexion</h2>
  <button onclick="deconnecter()">Se déconnecter</button>

  <button class="return-btn" onclick="retourIndex()">Retour à l'index</button>

  <p id="status">Déconnecté</p>
</div>

<script>
function inscrire() {
    const user = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        email: document.getElementById('email').value,
        numero: document.getElementById('numero').value
    };
    localStorage.setItem('user', JSON.stringify(user));
    alert('Compte créé !');
}

function connecter() {
    const email = document.getElementById('loginEmail').value;
    const user = JSON.parse(localStorage.getItem('user'));

    if (user && user.email === email) {
        sessionStorage.setItem('connectedUser', JSON.stringify(user));
        document.getElementById('status').innerText = `Connecté : ${user.prenom} ${user.nom}`;
    } else {
        alert('Utilisateur non trouvé');
    }
}

function deconnecter() {
    sessionStorage.removeItem('connectedUser');
    document.getElementById('status').innerText = 'Déconnecté';
}

function retourIndex() {
    window.location.href = "index.html"; // Redirige vers index.html
}
</script>

</body>
</html>
